services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sp-db
    user: root
    environment:
      TZ: Asia/Bangkok
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SmartParking@2026}
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [app-network]

  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sp-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Bangkok
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SmartParking@2026}
    volumes:
      - ./database:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        for f in /scripts/*.sql; do
          echo "running $$f"
          /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i "$$f" || exit 1
        done
        echo "database ready"
    networks: [app-network]

  backend:
    build: ./backend
    container_name: sp-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Bangkok
      DB_URL: jdbc:sqlserver://db:1433;databaseName=SmartParking;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-SmartParking@2026}
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [app-network]

  frontend:
    build: ./frontend
    container_name: sp-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:3000:3000"
    networks: [app-network]

networks:
  app-network:

volumes:
  mssql-data: